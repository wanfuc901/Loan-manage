name: Kiểm thử

on:
  push:
    paths: ["js/**", "tests/**", "reminder/**", ".github/workflows/test.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reminder/requirements.txt
      - run: node tests/parse.test.mjs
      - run: python tests/test_crypto_compat.py

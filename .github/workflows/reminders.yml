name: Nhắc hạn trả nợ

on:
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam. GitHub có thể chạy trễ vài phút đến vài chục phút.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Gửi email thử kể cả khi không có khoản nào đến hạn"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r reminder/requirements.txt
      - name: Gửi email
        env:
          SYNC_PASSPHRASE: ${{ secrets.SYNC_PASSPHRASE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: python reminder/send_reminders.py
